<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品登録</title>
<style>
  :root{--g:#2d6a4f;--bg:#f6f7f5;--line:#ddd;--warn:#c0392b}
  *{box-sizing:border-box}
  body{font-family:sans-serif;margin:0;padding:16px;background:var(--bg);color:#222;max-width:560px;margin:auto}
  h1{font-size:20px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
  h1 small{font-size:12px;color:#666;font-weight:normal}
  button{font-size:18px;padding:12px 16px;margin:4px 4px 4px 0;border:0;border-radius:10px;background:var(--g);color:#fff}
  button.sub{background:#888}
  button.big{width:100%;font-size:20px;padding:16px}
  button:disabled{opacity:.5}
  .card{background:#fff;border-radius:12px;padding:12px;margin:10px 0}
  #photoPrev{width:100%;max-height:260px;object-fit:contain;display:none;border-radius:8px;margin-top:8px;background:#eee}
  #q{font-size:24px;font-weight:bold;min-height:30px}
  #heard{font-size:18px;min-height:26px;color:#0a6;margin-top:6px}
  #status{font-size:14px;color:#666;margin-top:6px}
  table{width:100%;border-collapse:collapse}
  td{border-bottom:1px solid var(--line);padding:6px 4px;font-size:16px}
  td:first-child{width:45%}
  td input.pending{background:#ffe599}
  td input{width:100%;font-size:17px;padding:6px;border:1px solid var(--line);border-radius:6px}
  tr.now td{background:#fff3c4}
  .unit{font-size:13px;color:#666;padding-left:4px;white-space:nowrap}
  #result{display:none}
  #result.ok{border:2px solid var(--g)}
  #result.dup{border:2px solid var(--warn)}
  #result h2{font-size:18px;margin:0 0 6px}
  .dupitem{font-size:15px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .help{font-size:13px;color:#555;line-height:1.6}
  #setup{display:none}
  #setup input{width:100%;font-size:18px;padding:10px;margin:4px 0 10px;border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body>

<!-- 初回設定 -->
<div id="setup" class="card">
  <h1>初回設定</h1>
  <div>登録者名（スプシの「登録者」に入ります）</div>
  <input id="setName" placeholder="例：後藤">
  <div>合言葉（管理者から聞いてください）</div>
  <input id="setKey" type="password">
  <button class="big" id="setSave">保存して始める</button>
  <div id="setMsg" class="help"></div>
</div>

<!-- メイン -->
<div id="main" style="display:none">
  <h1>商品登録 <small id="who"></small></h1>

  <div class="card">
    <button class="big" id="photoBtn">📷 写真を撮る</button>
    <input id="photo" type="file" accept="image/*" capture="environment" style="display:none">
    <img id="photoPrev" alt="">
  </div>

  <div class="card">
    <button id="start">🎤 音声入力スタート</button>
    <button class="sub" id="back">戻る</button>
    <button class="sub" id="skip">飛ばす</button>
    <button class="sub" id="later">まだ</button>
    <button class="sub" id="stop">止める</button>
    <div id="q"></div>
    <div id="heard"></div>
    <div id="status"></div>
  </div>

  <div class="card">
    <table id="tbl"></table>
    <div class="help">聞き間違いは欄をタップして直接直せます</div>
  </div>

  <button class="big" id="save">保存する</button>

  <div id="result" class="card"></div>

  <div class="help">
    ・質問に「12センチです」のように答える（「です」で確定）<br>
    ・「なし」「飛ばす」→ 空欄で次へ／「まだ」→ 空欄＋スプシで色付け（後で入力する印）<br>
    ・「戻って」→ 1つ前へ<br>
    ・最後に「保存しますか？」→「はい」で保存<br>
    <a href="#" id="reset">登録者名・合言葉を変更</a>
  </div>
</div>

<script>
// ▼ Apps Scriptのウェブアプリ URL（デプロイ後に差し替え）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzZYscLmBsvhV-S-5-lYwOhJKv8XHwv1jZkOuDHniVHgvfbULczJT_g0rdBeaGg5TqnAg/exec';

const ITEMS = [
  {f:'supplier',  k:'仕入先コード',  q:'仕入先コードは？', code:true},
  {f:'name',      k:'商品名',        q:'商品名は？', text:true},
  {f:'color',     k:'色',            q:'色は？', text:true},
  {f:'tate',      k:'縦・高さ',      q:'高さは？', u:'cm'},
  {f:'yokoAri',   k:'横・持ち手有',  q:'持ち手ありの横幅は？', u:'cm'},
  {f:'yokoNashi', k:'横・持ち手無',  q:'持ち手なしの横幅は？', u:'cm'},
  {f:'oku',       k:'奥行き',        q:'奥行きは？', u:'cm'},
  {f:'weight',    k:'重量',          q:'重さは？', u:'g'},
  {f:'capacity',  k:'容量',          q:'容量は？', u:'ml'},
  {f:'kasane',    k:'2枚重ね高さ',   q:'2枚重ねた高さは？', u:'cm'}
];
const CONFIRM = ITEMS.length; // 最後の「保存しますか？」
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let idx = 0, running = false, rec = null, buf = '', listening = false;
let photoData = '';   // base64（縮小済みJPEG）
let saving = false;
const pending = new Set();   // 「まだ」と言った項目（スプシで色付け）

/* ---------- 設定（端末ごとに保存） ---------- */
function getSet(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function putSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function showSetup(){ $('setup').style.display='block'; $('main').style.display='none';
  $('setName').value = getSet('user'); }
function showMain(){ $('setup').style.display='none'; $('main').style.display='block';
  $('who').textContent = '登録者：' + getSet('user'); }
$('setSave').onclick = async () => {
  const n = $('setName').value.trim(), k = $('setKey').value.trim();
  if(!n || !k){ $('setMsg').textContent = '両方入れてください'; return; }
  $('setMsg').textContent = '確認中…';
  try{
    const j = await post({action:'ping', key:k});
    if(!j.ok){ $('setMsg').textContent = j.error || '確認できませんでした'; return; }
  }catch(e){ $('setMsg').textContent = '通信エラー：' + e.message; return; }
  putSet('user', n); putSet('key', k); showMain();
};
$('reset').onclick = e => { e.preventDefault(); showSetup(); };

/* ---------- 入力表 ---------- */
function bindInputs(){ ITEMS.forEach(it=>$('v_'+it.f).addEventListener('input',()=>{ if($('v_'+it.f).value) unmarkPending(it.f); })); }
function buildTable(){
  $('tbl').innerHTML = ITEMS.map((it,i)=>
    `<tr id="r${i}"><td>${it.k}</td><td style="display:flex;align-items:center">
      <input id="v_${it.f}" ${it.text||it.code?'':'inputmode="decimal"'}>
      ${it.u?`<span class="unit">${it.u}</span>`:''}</td></tr>`).join('');
}
function mark(){ ITEMS.forEach((_,i)=>$('r'+i).classList.toggle('now', running && i===idx)); }
function setVal(f,v){ $('v_'+f).value = v; unmarkPending(f); }
function markPending(f){ $('v_'+f).value = ''; pending.add(f); $('v_'+f).classList.add('pending'); $('v_'+f).placeholder = 'まだ'; }
function unmarkPending(f){ pending.delete(f); $('v_'+f).classList.remove('pending'); $('v_'+f).placeholder = ''; }
function clearAll(){ ITEMS.forEach(it=>setVal(it.f,'')); photoData=''; $('photoPrev').style.display='none';
  $('result').style.display='none'; $('q').textContent=''; $('heard').textContent=''; }

/* ---------- 写真（縮小してから送る：ドライブ容量の節約） ---------- */
$('photoBtn').onclick = () => $('photo').click();
$('photo').onchange = async () => {
  const f = $('photo').files[0]; if(!f) return;
  const img = new Image();
  img.onload = () => {
    const MAX = 1280, s = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const url = c.toDataURL('image/jpeg', 0.8);
    photoData = url.split(',')[1];
    $('photoPrev').src = url; $('photoPrev').style.display='block';
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
};

/* ---------- 音声 ---------- */
function status(s){ $('status').textContent = s; }
function kanjiToNum(s){
  const d={'〇':0,'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  return s.replace(/[〇零一二三四五六七八九十百千]+(点[〇零一二三四五六七八九]+)?/g, m=>{
    const [ip, dp] = m.split('点'); let total=0, cur=0;
    for(const c of ip){
      if(c in d) cur = cur*10 + d[c];
      else { const u={'十':10,'百':100,'千':1000}[c]; total += (cur||1)*u; cur=0; }
    }
    total += cur;
    return dp ? total + '.' + [...dp].map(c=>d[c]).join('') : String(total);
  });
}
function speak(text, then){
  let done = false; const next = () => { if(!done){ done = true; then && then(); } };
  setTimeout(next, 600 + text.length * 250);
  if(!window.speechSynthesis){ next(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP';
  const ja = speechSynthesis.getVoices().find(v => /ja/i.test(v.lang)); if(ja) u.voice = ja;
  u.onend = next; u.onerror = next; speechSynthesis.speak(u);
}
function ask(){
  if(idx > CONFIRM){ stopAll(); return; }
  mark();
  const q = idx === CONFIRM ? '保存しますか？' : ITEMS[idx].q;
  $('q').textContent = q; $('heard').textContent = ''; buf = '';
  stopListen();
  speak(q, startListen);
}
function startListen(){
  if(!running) return;
  listening = true; status('🎤 聞き取り中…');
  try { rec.start(); } catch(e){ setTimeout(()=>{ try{ rec.start(); }catch(e2){} }, 400); }
}
function stopListen(){ listening = false; try{ rec.stop(); }catch(e){} }
function stopAll(){ running = false; stopListen(); mark(); $('q').textContent=''; status(''); }

function handle(text){
  // 句点・空白だけ除く（小数点の「.」は残す：2.1 が 21 にならないように）
  const t = text.normalize('NFKC').replace(/[\s。、]/g,'').replace(/\.(?!\d)/g,'');
  if(/戻って|もどって/.test(t)){ idx = Math.max(0, idx-1); ask(); return true; }
  if(idx === CONFIRM){
    if(/はい|保存|ほぞん|お願い/.test(t)){ stopAll(); save(); return true; }
    if(/いいえ|まだ|やめ|しない/.test(t)){ stopAll(); status('確認して「保存する」を押してください'); return true; }
    return false;
  }
  if(/^(まだ)(です)?$/.test(t)){ markPending(ITEMS[idx].f); idx++; ask(); return true; }
  if(/^(飛ばす|飛ばして|とばす|とばして|スキップ|なし|無し)(です)?$/.test(t)){ setVal(ITEMS[idx].f,''); idx++; ask(); return true; }
  if(!/です$/.test(t)) return false;
  const body = t.replace(/です$/,''); const it = ITEMS[idx];
  if(it.text){
    setVal(it.f, body.replace(/^(は|が)/,''));           // 商品名・色は漢数字もそのまま
  } else if(it.code){
    setVal(it.f, kanjiToNum(body.replace(/^(は|が)/,'')).replace(/(\d)点(\d)/g,'$1.$2').toUpperCase());
  } else {
    const n = kanjiToNum(body).replace(/(\d)点(\d)/g,'$1.$2'); // 「2点1」→2.1
    const m = n.match(/\d+(\.\d+)?/);
    if(!m){ status('数字が聞き取れませんでした。もう一度どうぞ'); buf=''; return true; }
    setVal(it.f, m[0]); // 単位は付けず数字だけ
  }
  idx++; ask(); return true;
}
function setupRec(){
  rec = new SR(); rec.lang = 'ja-JP'; rec.interimResults = true; rec.continuous = true;
  rec.onresult = e => {
    if(!listening) return;
    let interim = '';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r = e.results[i]; if(r.isFinal) buf += r[0].transcript; else interim += r[0].transcript;
    }
    $('heard').textContent = buf + interim;
    handle(buf + interim);
  };
  rec.onerror = e => { if(e.error !== 'no-speech' && e.error !== 'aborted') status('エラー: ' + e.error); };
  rec.onend = () => { if(running && listening) setTimeout(()=>{ try{ rec.start(); }catch(e){} }, 300); };
}
$('start').onclick = () => {
  if(!SR){ status('この端末・ブラウザは音声認識に対応していません（Chrome／Safariで開いてください）'); return; }
  if(!rec) setupRec();
  // 空欄の最初の項目から始める
  idx = ITEMS.findIndex(it => !$('v_'+it.f).value && !pending.has(it.f)); if(idx < 0) idx = CONFIRM;
  running = true; ask();
};
$('back').onclick = () => { if(running){ idx=Math.max(0,idx-1); ask(); } };
$('skip').onclick = () => { if(running && idx < CONFIRM){ setVal(ITEMS[idx].f,''); idx++; ask(); } };
$('stop').onclick = stopAll;
$('later').onclick = () => { if(running && idx < CONFIRM){ markPending(ITEMS[idx].f); idx++; ask(); } };

/* ---------- 保存 ---------- */
async function post(obj){
  // text/plain で送る（Apps Scriptへの送信で事前確認通信を起こさないため）
  const res = await fetch(GAS_URL, {method:'POST', body: JSON.stringify(obj)});
  return res.json();
}
async function save(){
  if(saving) return;
  const data = {}; ITEMS.forEach(it => data[it.f] = $('v_'+it.f).value.trim());
  if(!data.name && !photoData){ status('商品名か写真のどちらかは入れてください'); return; }
  for(const it of ITEMS){ if(!it.text && !it.code && data[it.f] && isNaN(Number(data[it.f]))){ status(it.k+'は数字で入れてください'); return; } }
  saving = true; $('save').disabled = true; $('save').textContent = '保存中…';
  try{
    const j = await post(Object.assign({action:'add', key:getSet('key'), user:getSet('user'), image:photoData,
      pending:[...pending].filter(f=>!$('v_'+f).value)}, data));
    if(!j.ok) throw new Error(j.error || '保存できませんでした');
    showResult(j);
  }catch(e){
    status('保存エラー：' + e.message + '（入力内容は残っています）');
    speak('保存できませんでした');
  }finally{
    saving = false; $('save').disabled = false; $('save').textContent = '保存する';
  }
}
$('save').onclick = save;

function showResult(j){
  const r = $('result'); r.style.display = 'block';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  if(j.matches && j.matches.length){
    r.className = 'card dup';
    r.innerHTML = `<h2>⚠ 保存しました（重複の可能性あり）</h2>
      <div class="help">${esc(j.dup)}</div>` +
      j.matches.map(m=>`<div class="dupitem">ID ${esc(m.id)}：${esc(m.name)} ${esc(m.color)}（${esc(m.reason)}）</div>`).join('') +
      `<button class="big" id="next">次の商品へ</button>`;
    speak('保存しました。重複の可能性があります');
  }else{
    r.className = 'card ok';
    r.innerHTML = `<h2>✓ 保存しました（ID ${esc(j.id)}）</h2><button class="big" id="next">次の商品へ</button>`;
    speak('保存しました');
  }
  $('next').onclick = () => { clearAll(); window.scrollTo(0,0); };
  r.scrollIntoView({behavior:'smooth'});
}

/* ---------- 起動 ---------- */
buildTable(); bindInputs();
if(getSet('user') && getSet('key')) showMain(); else showSetup();
</script>
</body>
</html>
