<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品登録</title>
<style>
  :root{--g:#2d6a4f;--bg:#f6f7f5;--line:#ddd;--warn:#c0392b}
  *{box-sizing:border-box}
  body{font-family:sans-serif;margin:0;padding:16px;background:var(--bg);color:#222;max-width:560px;margin:auto}
  h1{font-size:20px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
  h1 small{font-size:12px;color:#666;font-weight:normal}
  button{font-size:18px;padding:12px 16px;margin:4px 4px 4px 0;border:0;border-radius:10px;background:var(--g);color:#fff}
  button.sub{background:#888}
  button.big{width:100%;font-size:20px;padding:16px}
  button:disabled{opacity:.5}
  .card{background:#fff;border-radius:12px;padding:12px;margin:10px 0}
  #photoPrev{width:100%;max-height:260px;object-fit:contain;display:none;border-radius:8px;margin-top:8px;background:#eee}
  #q{font-size:24px;font-weight:bold;min-height:30px}
  #heard{font-size:18px;min-height:26px;color:#0a6;margin-top:6px}
  #status{font-size:14px;color:#666;margin-top:6px}
  table{width:100%;border-collapse:collapse}
  td{border-bottom:1px solid var(--line);padding:6px 4px;font-size:16px}
  td:first-child{width:45%}
  td input.pending{background:#ffe599}
  td input{width:100%;font-size:17px;padding:6px;border:1px solid var(--line);border-radius:6px}
  tr.now td{background:#fff3c4}
  .unit{font-size:13px;color:#666;padding-left:4px;white-space:nowrap}
  #result{display:none}
  #result.ok{border:2px solid var(--g)}
  #result.dup{border:2px solid var(--warn)}
  #result h2{font-size:18px;margin:0 0 6px}
  .dupitem{font-size:15px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .help{font-size:13px;color:#555;line-height:1.6}
  #setup{display:none}
  .tabs{display:flex;gap:6px;margin-bottom:8px}
  .tabs button{flex:1;background:#bbb}
  .tabs button.on{background:var(--g)}
  .hit{display:flex;gap:10px;align-items:flex-start}
  .hit img{width:110px;height:110px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}
  .hit .meta{font-size:15px;line-height:1.6;flex:1}
  .ok{color:#2d6a4f;font-weight:bold}.ng{color:var(--warn);font-weight:bold}
  .hitcard.strong{background:#111;color:#fff}
  .hitcard.strong .meta{font-weight:bold}
  .hitcard.strong .ok{color:#7CFC00;font-size:22px}
  .hitcard.strong .ng{color:#ff8a80}
  .hitcard.weak{background:#eee;color:#999}
  .hitcard.weak img{opacity:.6}
  .sthumb{position:relative}.sthumb img{width:64px;height:64px;object-fit:cover;border-radius:6px}
  .sthumb span{position:absolute;top:-6px;right:-6px;background:#c0392b;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;font-size:13px;line-height:20px}
  #setup input{width:100%;font-size:18px;padding:10px;margin:4px 0 10px;border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body>

<!-- 初回設定 -->
<div id="setup" class="card">
  <h1>初回設定</h1>
  <div>登録者名（スプシの「登録者」に入ります）</div>
  <input id="setName" placeholder="例：後藤">
  <div>合言葉（管理者から聞いてください）</div>
  <input id="setKey" type="password">
  <button class="big" id="setSave">保存して始める</button>
  <div id="setMsg" class="help"></div>
</div>

<!-- メイン -->
<div id="main" style="display:none">
  <h1>商品登録 <small id="who"></small></h1>
  <div class="tabs"><button id="tabReg" class="on">登録</button><button id="tabSearch">画像検索</button></div>
  <div id="regView">

  <div class="card">
    <button class="big" id="photoBtn">📷 写真を撮る</button>
    <input id="photo" type="file" accept="image/*" capture="environment" style="display:none">
    <img id="photoPrev" alt="">
    <div id="qrInfo" class="help" style="margin-top:6px"></div>
    <img id="qrPrev" alt="" style="display:none;max-width:140px;border:1px solid #ddd;border-radius:6px">
  </div>

  <div class="card">
    <button id="start">🎤 音声入力スタート</button>
    <button class="sub" id="back">戻る</button>
    <button class="sub" id="skip">飛ばす</button>
    <button class="sub" id="later">まだ</button>
    <button class="sub" id="stop">止める</button>
    <div id="q"></div>
    <div id="heard"></div>
    <div id="status"></div>
  </div>

  <div class="card">
    <table id="tbl"></table>
    <div class="help">聞き間違いは欄をタップして直接直せます</div>
  </div>

  <button class="big" id="save">保存する</button>

  <div id="result" class="card"></div>

  <div class="help">
    ・質問に「12センチです」のように答える（「です」で確定）<br>
    ・「なし」「飛ばす」→ 空欄で次へ／「まだ」→ 空欄＋スプシで色付け（後で入力する印）<br>
    ・「戻って」→ 1つ前へ<br>
    ・最後に「保存しますか？」→「はい」で保存<br>
    <a href="#" id="reset">登録者名・合言葉を変更</a>
  </div>
  </div><!-- /regView -->

  <div id="searchView" style="display:none">
    <div class="card">
      <div>仕入先（Xが付くシート）</div>
      <select id="sTab" style="width:100%;font-size:18px;padding:10px;margin:6px 0"><option value="">読み込み中…</option></select>
      <button class="big" id="sPhotoBtn">📷 写真を追加（角度を変えて何枚でも）</button>
      <input id="sPhoto" type="file" accept="image/*" capture="environment" style="display:none">
      <div id="sThumbs" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"></div>
      <div id="sStatus" class="help" style="margin-top:6px"></div>
    </div>
    <div class="card" id="sMeasure">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>測ったサイズ</b>
        <button id="mVoice" style="font-size:15px;padding:8px 12px">🎤 音声で入力</button></div>
      <div id="mQ" style="font-size:20px;font-weight:bold;min-height:24px"></div>
      <div id="mHeard" style="color:#0a6;min-height:20px"></div>
      <table>
        <tr><td>縦・高さ</td><td style="display:flex;align-items:center"><input id="m_t" inputmode="decimal"><span class="unit">cm</span></td></tr>
        <tr><td>横・持ち手有</td><td style="display:flex;align-items:center"><input id="m_ya" inputmode="decimal"><span class="unit">cm</span></td></tr>
        <tr><td>横・持ち手無</td><td style="display:flex;align-items:center"><input id="m_yn" inputmode="decimal"><span class="unit">cm</span></td></tr>
        <tr><td>奥行き</td><td style="display:flex;align-items:center"><input id="m_ok" inputmode="decimal"><span class="unit">cm</span></td></tr>
        <tr><td>重量</td><td style="display:flex;align-items:center"><input id="m_w" inputmode="decimal"><span class="unit">g</span></td></tr>
      </table>
      <div class="help">サイズを入れると、画像で似ていなくてもサイズが合う商品が上に出ます</div>
    </div>
    <button class="big sub" id="sClear">✖ クリア（次の商品へ）</button>
    <div id="sResults"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script>
// ▼ Apps Scriptのウェブアプリ URL（デプロイ後に差し替え）
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzZYscLmBsvhV-S-5-lYwOhJKv8XHwv1jZkOuDHniVHgvfbULczJT_g0rdBeaGg5TqnAg/exec';

const ITEMS = [
  {f:'supplier',  k:'仕入先コード',  q:'仕入先コードは？', code:true},
  {f:'name',      k:'商品名',        q:'商品名は？', text:true},
  {f:'color',     k:'色・柄',        q:'色・柄は？', text:true},
  {f:'tate',      k:'縦・高さ',      q:'高さは？', u:'cm'},
  {f:'yokoAri',   k:'横・持ち手有',  q:'持ち手ありの横幅は？', u:'cm'},
  {f:'yokoNashi', k:'横・持ち手無',  q:'持ち手なしの横幅は？', u:'cm'},
  {f:'oku',       k:'奥行き',        q:'奥行きは？', u:'cm'},
  {f:'weight',    k:'重量',          q:'重さは？', u:'g'},
  {f:'capacity',  k:'容量',          q:'容量は？', u:'ml'},
  {f:'kasane',    k:'2枚重ね高さ',   q:'2枚重ねた高さは？', u:'cm'}
];
const CONFIRM = ITEMS.length; // 最後の「保存しますか？」
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let idx = 0, running = false, rec = null, buf = '', listening = false;
let voiceMode = 'reg';   // reg＝登録 / measure＝画像検索のサイズ入力
let photoData = '';   // base64（縮小済みJPEG）
let qrImage = '', qrText = '';
let smallData = '';  // 白抜き用の小さい写真（約500px）   // QRの切り抜き（base64）と読み取り内容
let saving = false;
const pending = new Set();   // 「まだ」と言った項目（スプシで色付け）

/* ---------- 設定（端末ごとに保存） ---------- */
function getSet(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function putSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function showSetup(){ $('setup').style.display='block'; $('main').style.display='none';
  $('setName').value = getSet('user'); }
function showMain(){ $('setup').style.display='none'; $('main').style.display='block';
  $('who').textContent = '登録者：' + getSet('user'); }
$('setSave').onclick = async () => {
  const n = $('setName').value.trim(), k = $('setKey').value.trim();
  if(!n || !k){ $('setMsg').textContent = '両方入れてください'; return; }
  $('setMsg').textContent = '確認中…';
  try{
    const j = await post({action:'ping', key:k});
    if(!j.ok){ $('setMsg').textContent = j.error || '確認できませんでした'; return; }
  }catch(e){ $('setMsg').textContent = '通信エラー：' + e.message; return; }
  putSet('user', n); putSet('key', k); showMain();
};
$('reset').onclick = e => { e.preventDefault(); showSetup(); };

/* ---------- 入力表 ---------- */
function bindInputs(){ ITEMS.forEach(it=>$('v_'+it.f).addEventListener('input',()=>{ if($('v_'+it.f).value) unmarkPending(it.f); })); }
function buildTable(){
  $('tbl').innerHTML = ITEMS.map((it,i)=>
    `<tr id="r${i}"><td>${it.k}</td><td style="display:flex;align-items:center">
      <input id="v_${it.f}" ${it.text||it.code?'':'inputmode="decimal"'}>
      ${it.u?`<span class="unit">${it.u}</span>`:''}</td></tr>`).join('');
}
function mark(){ ITEMS.forEach((_,i)=>$('r'+i).classList.toggle('now', running && i===idx)); }
function setVal(f,v){ $('v_'+f).value = v; unmarkPending(f); }
function markPending(f){ $('v_'+f).value = ''; pending.add(f); $('v_'+f).classList.add('pending'); $('v_'+f).placeholder = 'まだ'; }
function unmarkPending(f){ pending.delete(f); $('v_'+f).classList.remove('pending'); $('v_'+f).placeholder = ''; }
function clearAll(){ ITEMS.forEach(it=>setVal(it.f,'')); photoData=''; smallData=''; $('photoPrev').style.display='none';
  qrImage=''; qrText=''; $('qrPrev').style.display='none'; $('qrInfo').textContent='';
  $('result').style.display='none'; $('q').textContent=''; $('heard').textContent=''; }

/* ---------- 写真（縮小してから送る：ドライブ容量の節約） ---------- */
$('photoBtn').onclick = () => $('photo').click();
$('photo').onchange = async () => {
  const f = $('photo').files[0]; if(!f) return;
  const img = new Image();
  img.onload = () => {
    const MAX = 1280, s = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const url = c.toDataURL('image/jpeg', 0.8);
    photoData = url.split(',')[1];
    // 白抜き用の小さい版（Claudeでの白抜き処理を軽くするため）
    const s2 = Math.min(1, 500 / Math.max(img.width, img.height));
    const c2 = document.createElement('canvas');
    c2.width = Math.round(img.width*s2); c2.height = Math.round(img.height*s2);
    c2.getContext('2d').drawImage(img,0,0,c2.width,c2.height);
    smallData = c2.toDataURL('image/jpeg', 0.85).split(',')[1];
    $('photoPrev').src = url; $('photoPrev').style.display='block';
    findQR(img);
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
};

/* ---------- QRコード検出・切り抜き ---------- */
function findQR(img){
  qrImage = ''; qrText = ''; $('qrPrev').style.display = 'none';
  if(!window.jsQR){ $('qrInfo').textContent = 'QR：読み取り部品を読み込めませんでした'; return; }
  $('qrInfo').textContent = 'QR：探しています…';
  setTimeout(() => {
    // 大きめ→小さめの順に試す（写真によって見つかりやすい大きさが違うため）
    for(const MAX of [1600, 1000, 700]){
      const s = Math.min(1, MAX / Math.max(img.width, img.height));
      const w = Math.round(img.width*s), h = Math.round(img.height*s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      const code = jsQR(ctx.getImageData(0,0,w,h).data, w, h, {inversionAttempts:'attemptBoth'});
      if(!code) continue;
      const L = code.location, pts = [L.topLeftCorner, L.topRightCorner, L.bottomLeftCorner, L.bottomRightCorner];
      const xs = pts.map(p=>p.x/s), ys = pts.map(p=>p.y/s);
      let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      const m = Math.max(x1-x0, y1-y0) * 0.15;   // 余白
      x0 = Math.max(0, x0-m); y0 = Math.max(0, y0-m);
      x1 = Math.min(img.width, x1+m); y1 = Math.min(img.height, y1+m);
      const cw = x1-x0, ch = y1-y0, k = Math.min(1, 400 / Math.max(cw, ch));
      const out = document.createElement('canvas');
      out.width = Math.round(cw*k); out.height = Math.round(ch*k);
      out.getContext('2d').drawImage(img, x0, y0, cw, ch, 0, 0, out.width, out.height);
      const url = out.toDataURL('image/jpeg', 0.9);
      qrImage = url.split(',')[1]; qrText = code.data || '';
      $('qrPrev').src = url; $('qrPrev').style.display = 'block';
      $('qrInfo').textContent = 'QR：あり（' + (qrText || '内容は読めず') + '）';
      return;
    }
    $('qrInfo').textContent = 'QR：見つかりません（必要なら撮り直し）';
  }, 50);
}

/* ---------- 音声 ---------- */
function status(s){ $('status').textContent = s; }
function kanjiToNum(s){
  const d={'〇':0,'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
  return s.replace(/[〇零一二三四五六七八九十百千]+(点[〇零一二三四五六七八九]+)?/g, m=>{
    const [ip, dp] = m.split('点'); let total=0, cur=0;
    for(const c of ip){
      if(c in d) cur = cur*10 + d[c];
      else { const u={'十':10,'百':100,'千':1000}[c]; total += (cur||1)*u; cur=0; }
    }
    total += cur;
    return dp ? total + '.' + [...dp].map(c=>d[c]).join('') : String(total);
  });
}
function speak(text, then){
  let done = false; const next = () => { if(!done){ done = true; then && then(); } };
  setTimeout(next, 600 + text.length * 250);
  if(!window.speechSynthesis){ next(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP';
  const ja = speechSynthesis.getVoices().find(v => /ja/i.test(v.lang)); if(ja) u.voice = ja;
  u.onend = next; u.onerror = next; speechSynthesis.speak(u);
}
function ask(){
  if(idx > CONFIRM){ stopAll(); return; }
  mark();
  const q = idx === CONFIRM ? '保存しますか？' : ITEMS[idx].q;
  $('q').textContent = q; $('heard').textContent = ''; buf = '';
  stopListen();
  speak(q, startListen);
}
function startListen(){
  if(!running) return;
  listening = true; status('🎤 聞き取り中…'); if(voiceMode === 'measure') sStatus('🎤 聞き取り中…（最後に「です」）');
  try { rec.start(); } catch(e){ setTimeout(()=>{ try{ rec.start(); }catch(e2){} }, 400); }
}
function stopListen(){ listening = false; try{ rec.stop(); }catch(e){} }
function stopAll(){ running = false; stopListen(); mark(); $('q').textContent=''; status(''); }

// カタカナで聞き取られたアルファベットを英字に（エーアイ→AI、エックス→X）
const KANA_ABC = [['ダブリュー','W'],['エイチ','H'],['ジェイ','J'],['キュー','Q'],['エックス','X'],['ゼット','Z'],
  ['ディー','D'],['ティー','T'],['アール','R'],['エー','A'],['エイ','A'],['ビー','B'],['シー','C'],['イー','E'],
  ['エフ','F'],['ジー','G'],['アイ','I'],['ケー','K'],['ケイ','K'],['エル','L'],['エム','M'],['エヌ','N'],
  ['オー','O'],['ピー','P'],['エス','S'],['ユー','U'],['ブイ','V'],['ワイ','Y'],['バツ','X']];
function kanaToAbc(s){ KANA_ABC.forEach(([k,v])=>{ s = s.split(k).join(v); }); return s; }
function handle(text){
  // 句点・空白だけ除く（小数点の「.」は残す：2.1 が 21 にならないように）
  const t = text.normalize('NFKC').replace(/[\s。、]/g,'').replace(/\.(?!\d)/g,'');
  if(/戻って|もどって/.test(t)){ idx = Math.max(0, idx-1); ask(); return true; }
  if(idx === CONFIRM){
    if(/はい|保存|ほぞん|お願い/.test(t)){ stopAll(); save(); return true; }
    if(/いいえ|まだ|やめ|しない/.test(t)){ stopAll(); status('確認して「保存する」を押してください'); return true; }
    return false;
  }
  if(/^(まだ)(です)?$/.test(t)){ markPending(ITEMS[idx].f); idx++; ask(); return true; }
  if(/^(飛ばす|飛ばして|とばす|とばして|スキップ|なし|無し)(です)?$/.test(t)){ setVal(ITEMS[idx].f,''); idx++; ask(); return true; }
  if(!/です$/.test(t)) return false;
  const body = t.replace(/です$/,''); const it = ITEMS[idx];
  if(it.text){
    let v = body.replace(/^(は|が)/,'');
    if(it.f === 'name'){
      // 「76Xの0029」「941の001の01」のような商品コードは「の」をハイフンにする
      const c = kanaToAbc(kanjiToNum(v.replace(/(?<![十百千])[〇零一二三四五六七八九]+(?![十百千])/g, m => [...m].map(ch => '〇一二三四五六七八九'.indexOf(ch) >= 0 ? '〇一二三四五六七八九'.indexOf(ch) : 0).join('')))).replace(/ハイフン|マイナス/g,'-');   // 〇〇一 → 001 のように桁を残す
      if(/^[0-9A-Za-z]+([のノー\-][0-9A-Za-z]+)+$/.test(c)) v = c.replace(/[のノー]/g,'-').toUpperCase();
    }
    setVal(it.f, v);           // それ以外の商品名・色は聞き取ったまま
  } else if(it.code){
    setVal(it.f, kanaToAbc(kanjiToNum(body.replace(/^(は|が)/,''))).replace(/[^0-9A-Za-z]/g,'').toUpperCase());
  } else {
    const n = kanjiToNum(body).replace(/(\d)点(\d)/g,'$1.$2'); // 「2点1」→2.1
    const m = n.match(/\d+(\.\d+)?/);
    if(!m){ status('数字が聞き取れませんでした。もう一度どうぞ'); buf=''; return true; }
    setVal(it.f, m[0]); // 単位は付けず数字だけ
  }
  idx++; ask(); return true;
}
function setupRec(){
  rec = new SR(); rec.lang = 'ja-JP'; rec.interimResults = true; rec.continuous = true;
  rec.onresult = e => {
    if(!listening) return;
    let interim = '';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r = e.results[i]; if(r.isFinal) buf += r[0].transcript; else interim += r[0].transcript;
    }
    if(voiceMode === 'measure'){ $('mHeard').textContent = buf + interim; handleMeasure(buf + interim); return; }
    $('heard').textContent = buf + interim;
    handle(buf + interim);
  };
  rec.onerror = e => { if(e.error !== 'no-speech' && e.error !== 'aborted'){ status('エラー: ' + e.error); if(voiceMode === 'measure') sStatus('音声のエラー: ' + e.error); } };
  rec.onend = () => { if(running && listening) setTimeout(()=>{ try{ rec.start(); }catch(e){} }, 300); };
}
$('start').onclick = () => {
  voiceMode = 'reg';
  if(!SR){ status('この端末・ブラウザは音声認識に対応していません（Chrome／Safariで開いてください）'); return; }
  if(!rec) setupRec();
  // 空欄の最初の項目から始める
  idx = ITEMS.findIndex(it => !$('v_'+it.f).value && !pending.has(it.f)); if(idx < 0) idx = CONFIRM;
  running = true; ask();
};
$('back').onclick = () => { if(running){ idx=Math.max(0,idx-1); ask(); } };
$('skip').onclick = () => { if(running && idx < CONFIRM){ setVal(ITEMS[idx].f,''); idx++; ask(); } };
$('stop').onclick = stopAll;
$('later').onclick = () => { if(running && idx < CONFIRM){ markPending(ITEMS[idx].f); idx++; ask(); } };

/* ---------- 保存 ---------- */
async function post(obj){
  // text/plain で送る（Apps Scriptへの送信で事前確認通信を起こさないため）
  const res = await fetch(GAS_URL, {method:'POST', body: JSON.stringify(obj)});
  return res.json();
}
async function save(){
  if(saving) return;
  const data = {}; ITEMS.forEach(it => data[it.f] = $('v_'+it.f).value.trim());
  if(!data.name && !photoData){ status('商品名か写真のどちらかは入れてください'); return; }
  for(const it of ITEMS){ if(!it.text && !it.code && data[it.f] && isNaN(Number(data[it.f]))){ status(it.k+'は数字で入れてください'); return; } }
  saving = true; $('save').disabled = true; $('save').textContent = '保存中…';
  try{
    const j = await post(Object.assign({action:'add', key:getSet('key'), user:getSet('user'), image:photoData, small:smallData, qrImage:qrImage, qrText:qrText,
      pending:[...pending].filter(f=>!$('v_'+f).value)}, data));
    if(!j.ok) throw new Error(j.error || '保存できませんでした');
    showResult(j);
  }catch(e){
    status('保存エラー：' + e.message + '（入力内容は残っています）');
    speak('保存できませんでした');
  }finally{
    saving = false; $('save').disabled = false; $('save').textContent = '保存する';
  }
}
$('save').onclick = save;

function showResult(j){
  const r = $('result'); r.style.display = 'block';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  if(j.matches && j.matches.length){
    r.className = 'card dup';
    r.innerHTML = `<h2>⚠ 保存しました（重複の可能性あり）</h2>
      <div class="help">${esc(j.dup)}</div>` +
      j.matches.map(m=>`<div class="dupitem">ID ${esc(m.id)}：${esc(m.name)} ${esc(m.color)}（${esc(m.reason)}）</div>`).join('') +
      `<button class="big" id="next">次の商品へ</button>`;
    speak('保存しました。重複の可能性があります');
  }else{
    r.className = 'card ok';
    r.innerHTML = `<h2>✓ 保存しました（ID ${esc(j.id)}）</h2><button class="big" id="next">次の商品へ</button>`;
    speak('保存しました');
  }
  $('next').onclick = () => { clearAll(); window.scrollTo(0,0); };
  r.scrollIntoView({behavior:'smooth'});
}

/* ---------- 起動 ---------- */
buildTable(); bindInputs();
if(getSet('user') && getSet('key')) showMain(); else showSetup();

/* ================= 画像検索 ================= */
$('tabReg').onclick = () => { $('tabReg').classList.add('on'); $('tabSearch').classList.remove('on'); $('regView').style.display='block'; $('searchView').style.display='none'; stopAll(); };
$('tabSearch').onclick = () => { $('tabSearch').classList.add('on'); $('tabReg').classList.remove('on'); $('regView').style.display='none'; $('searchView').style.display='block'; stopAll(); loadTabs(); };
let net = null, tabsLoaded = false, feats = [], featsTab = '', qVecs = [], qThumbs = [], scoredAll = [];
function sStatus(t){ $('sStatus').textContent = t; }
async function getNet(){
  if(net) return net;
  sStatus('画像を見分ける部品を読み込み中…（初回だけ時間がかかります）');
  net = await mobilenet.load({version: 2, alpha: 1.0});
  return net;
}
async function loadTabs(){
  if(tabsLoaded) return;
  try{
    const j = await post({action:'tabs', key:getSet('key')});
    if(!j.ok) throw new Error(j.error);
    const last = getSet('sTab');
    $('sTab').innerHTML = '<option value="">選んでください</option>' + j.tabs.map(t => `<option ${t===last?'selected':''}>${t}</option>`).join('');
    tabsLoaded = true;
  }catch(e){ sStatus('シート一覧を読めませんでした：' + e.message); }
}
$('sTab').onchange = () => { putSet('sTab', $('sTab').value); feats = []; featsTab = ''; rescore(); };
function embed(img){
  return tf.tidy(() => { const v = net.infer(img, true).flatten(); return Array.from(v.div(v.norm()).dataSync()); });
}
function packFeat(a){ const m = Math.max(...a.map(Math.abs)) || 1; const b = new Int8Array(a.map(x => Math.round(x / m * 127))); let s=''; b.forEach(x => s += String.fromCharCode(x & 255)); return btoa(s); }
function unpackFeat(s){ const r = atob(s); const a = new Float32Array(r.length); for(let i=0;i<r.length;i++){ let x = r.charCodeAt(i); if(x>127) x-=256; a[i]=x; } let n=0; a.forEach(x=>n+=x*x); n=Math.sqrt(n)||1; return a.map(x=>x/n); }
function loadImg(src){ return new Promise((ok, ng) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ng; im.src = src; }); }
// 撮った写真は、切り抜き方を3通り（全体・中央85%・中央60%）にして特徴を作る
function crop(im, rate){
  const c = document.createElement('canvas'); c.width = c.height = 224;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 224, 224);
  if(rate >= 1){ const k = 224 / Math.max(im.width, im.height); const w = im.width*k, h = im.height*k; g.drawImage(im, (224-w)/2, (224-h)/2, w, h); }
  else { const s = Math.min(im.width, im.height) * rate; g.drawImage(im, (im.width - s)/2, (im.height - s)/2, s, s, 0, 0, 224, 224); }
  return c;
}
async function ensureFeats(tab){
  if(featsTab === tab && feats.length) return;
  const j = await post({action:'features', key:getSet('key'), tab});
  if(!j.ok) throw new Error(j.error);
  feats = j.rows; featsTab = tab;
  feats.forEach(r => { if(r.feat) r.vec = unpackFeat(r.feat); });
  const miss = feats.filter(r => !r.feat && r.img);
  if(!miss.length) return;
  await getNet();
  for(let i = 0; i < miss.length; i += 8){
    sStatus(`登録済み商品の特徴を準備中… ${Math.min(i+8, miss.length)} / ${miss.length}（初回だけ）`);
    const part = miss.slice(i, i + 8);
    const g = await post({action:'imgs', key:getSet('key'), ids: part.map(r => r.img)});
    if(!g.ok) throw new Error(g.error);
    const save = [];
    for(const r of part){
      const b64 = g.data[r.img]; if(!b64) continue;
      const im = await loadImg('data:image/jpeg;base64,' + b64);
      r.thumb = 'data:image/jpeg;base64,' + b64;
      const v = embed(im); r.feat = packFeat(v); r.vec = unpackFeat(r.feat);
      save.push({id: r.id, feat: r.feat});
    }
    if(save.length) await post({action:'saveFeat', key:getSet('key'), items: save});
  }
}
$('sPhotoBtn').onclick = () => { if(!$('sTab').value){ sStatus('先に仕入先を選んでください'); return; } $('sPhoto').click(); };
$('sPhoto').onchange = async () => {
  const f = $('sPhoto').files[0]; if(!f) return;
  $('sPhoto').value = '';
  try{
    const im = await loadImg(URL.createObjectURL(f));
    await getNet();
    await ensureFeats($('sTab').value);
    sStatus('似ている商品を探しています…');
    qVecs.push([1, 0.85, 0.6].map(r => embed(crop(im, r))));
    qThumbs.push(im.src);
    drawThumbs();
    rescore();
    sStatus(`写真${qThumbs.length}枚で検索中。角度を変えて追加すると当たりやすくなります`);
  }catch(e){ sStatus('エラー：' + e.message); }
};
function drawThumbs(){
  $('sThumbs').innerHTML = qThumbs.map((src, i) => `<div class="sthumb"><img src="${src}"><span data-i="${i}">×</span></div>`).join('');
  $('sThumbs').querySelectorAll('span').forEach(b => b.onclick = () => { const i = Number(b.dataset.i); qThumbs.splice(i, 1); qVecs.splice(i, 1); drawThumbs(); rescore(); });
}
// 似ている度：写真ごと・切り抜きごとに比べて一番似ている値（写真を増やすほど当たりやすい）
function rescore(){
  scoredAll = feats.map(r => {
    let best = 0;
    if(r.vec) qVecs.forEach(set => set.forEach(q => { let s = 0; for(let i=0;i<q.length;i++) s += r.vec[i]*q[i]; if(s > best) best = s; }));
    return Object.assign(r, {score: best});
  });
  renderHits();
}
['m_t','m_ya','m_yn','m_ok','m_w'].forEach(id => $(id).addEventListener('input', async () => {
  // 写真なしでサイズだけ入れた場合も、その仕入先の商品から探す
  if($('sTab').value && featsTab !== $('sTab').value){ try{ await getNet(); await ensureFeats($('sTab').value); }catch(e){ sStatus('エラー：' + e.message); return; } }
  rescore();
}));
function measured(){ const m = k => { const v = $(k).value.trim(); return v === '' || isNaN(Number(v)) ? null : Number(v); };
  return { t: m('m_t'), ya: m('m_ya'), w: m('m_w'), h: [m('m_yn'), m('m_ok')].filter(x => x !== null).sort((a,b)=>a-b) }; }
function judge(r, M){
  const num = v => (v === '' || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
  const near = (a, b) => (a === null || b === null) ? null : Math.abs(a - b) <= 0.5;
  const rh = [num(r.yn), num(r.ok)].filter(x => x !== null).sort((a,b)=>a-b);
  let h = null;
  if(M.h.length && rh.length) h = M.h.length === rh.length ? M.h.every((x,k) => Math.abs(x - rh[k]) <= 0.5) : rh.some(x => Math.abs(x - M.h[0]) <= 0.5);
  const rw = num(r.w);
  const w = (M.w === null || rw === null) ? null : Math.abs(M.w - rw) <= Math.min(30, Math.max(5, Math.max(M.w, rw) * 0.1));
  const res = { t: near(M.t, num(r.t)), ya: near(M.ya, num(r.ya)), h, w };
  res.ok = Object.values(res).filter(x => x === true).length;
  res.ng = Object.values(res).filter(x => x === false).length;
  return res;
}
async function renderHits(){
  const M = measured();
  const hasM = M.t !== null || M.ya !== null || M.w !== null || M.h.length;
  if(!qVecs.length && !hasM){ $('sResults').innerHTML = ''; return; }
  const list = scoredAll.map(r => Object.assign(r, {j: judge(r, M)}))
    .filter(r => qVecs.length || r.j.ok > 0)
    .sort((a, b) => hasM ? (b.j.ok - b.j.ng*0.5) - (a.j.ok - a.j.ng*0.5) || b.score - a.score : b.score - a.score)
    .slice(0, 8);
  const need = list.filter(r => !r.thumb && r.img).map(r => r.img);
  if(need.length){ try{ const g = await post({action:'imgs', key:getSet('key'), ids: need.slice(0, 10)}); if(g.ok) list.forEach(r => { if(!r.thumb && g.data[r.img]) r.thumb = 'data:image/jpeg;base64,' + g.data[r.img]; }); }catch(e){} }
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const mk = v => v === null ? '' : (v ? ' <span class="ok">◎</span>' : ' <span class="ng">×</span>');
  $('sResults').innerHTML = list.map((r, i) => {
    const cls = !hasM ? '' : (r.j.ok >= 2 ? 'strong' : 'weak');
    const title = r.sku ? esc(r.sku) : esc(r.label) + '（SKU未登録）';
    return `<div class="card hitcard ${cls}"><div class="hit"><img src="${r.thumb || ''}" alt="">
      <div class="meta"><b style="font-size:17px">${i+1}. ${title}</b>　<small>似ている度 ${Math.round(r.score*100)}</small><br>
      ${r.sku ? esc(r.label) + '　' : ''}色・柄：${esc(r.color)}<br>
      高さ ${esc(r.t)}${mk(r.j.t)}　横(有) ${esc(r.ya)}${mk(r.j.ya)}<br>
      横(無)・奥 ${esc(r.yn)}×${esc(r.ok)}${mk(r.j.h)}　重さ ${esc(r.w)}g${mk(r.j.w)}</div></div></div>`;
  }).join('');
}
$('sClear').onclick = () => {
  qVecs = []; qThumbs = []; drawThumbs();
  ['m_t','m_ya','m_yn','m_ok','m_w'].forEach(id => $(id).value = '');
  $('mQ').textContent = ''; $('mHeard').textContent = ''; stopAll();
  $('sResults').innerHTML = ''; sStatus('クリアしました'); window.scrollTo(0, 0);
};
/* --- サイズの音声入力 --- */
const MITEMS = [['m_t','高さは？'],['m_ya','持ち手ありの横幅は？'],['m_yn','持ち手なしの横幅は？'],['m_ok','奥行きは？'],['m_w','重さは？']];
let midx = 0;
function askM(){
  if(midx >= MITEMS.length){ stopAll(); $('mQ').textContent = '入力が終わりました'; speak('終わりました', ()=>{}); renderHits(); return; }
  $('mQ').textContent = MITEMS[midx][1]; $('mHeard').textContent = ''; buf = '';
  stopListen(); speak(MITEMS[midx][1], startListen);
}
function handleMeasure(text){
  const t = text.normalize('NFKC').replace(/[\s。、]/g,'').replace(/\.(?!\d)/g,'');
  if(/戻って|もどって/.test(t)){ midx = Math.max(0, midx-1); askM(); return; }
  if(/^(飛ばす|飛ばして|とばす|とばして|スキップ|なし|無し|まだ)(です)?$/.test(t)){ midx++; askM(); return; }
  if(/^(終わり|おわり|終了)(です)?$/.test(t)){ midx = MITEMS.length; askM(); return; }
  if(!/です$/.test(t)) return;
  const n = kanjiToNum(t.replace(/です$/,'')).replace(/(\d)点(\d)/g,'$1.$2').match(/\d+(\.\d+)?/);
  if(!n){ $('mHeard').textContent = '数字が聞き取れませんでした。もう一度どうぞ'; buf=''; return; }
  $(MITEMS[midx][0]).value = n[0]; $(MITEMS[midx][0]).dispatchEvent(new Event('input'));
  midx++; askM();
}
$('mVoice').onclick = () => {
  if(!SR){ sStatus('この端末・ブラウザは音声認識に対応していません'); return; }
  if(!rec) setupRec();
  voiceMode = 'measure'; running = true;
  midx = MITEMS.findIndex(([id]) => !$(id).value); if(midx < 0) midx = 0;
  askM();
};
